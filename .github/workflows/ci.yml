name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (pruebas y precision de extraccion)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            Backend/requirements.txt
            Backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas
        run: pytest
      - name: Precision por campo (debe mantenerse en 100 % sobre los expedientes de prueba)
        run: python tests/reporte_precision.py --minimo 100
      - name: Generalizacion a otra redaccion (informativo, no bloquea)
        run: python tests/reporte_precision.py --fixtures reescritos --minimo 0

  frontend:
    name: Frontend (build y lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Lint (informativo: hay errores previos por corregir; quitar continue-on-error al limpiarlos)
        run: npm run lint
        continue-on-error: true
