services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sigeja_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sigeja_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./Backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-sigeja_db}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET requerido}
      SIGEJA_JWT_EXP_MINUTES: ${SIGEJA_JWT_EXP_MINUTES:-480}
      SIGEJA_OLLAMA_RAG_TIMEOUT: ${SIGEJA_OLLAMA_RAG_TIMEOUT:-900}
      SIGEJA_OLLAMA_RAG_MAX_CTX: ${SIGEJA_OLLAMA_RAG_MAX_CTX:-32768}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      TESSERACT_CMD: tesseract
    volumes:
      - backend_pdfs:/app/pdfs_guardados
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - backend

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    profiles:
      - ai
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    gpus: all

volumes:
  postgres_data:
  backend_pdfs:
  ollama_data:
